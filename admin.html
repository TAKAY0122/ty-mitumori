<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ページ — YOSHIZAKI STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gothic:'BIZ UDPGothic','Noto Sans JP',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --ink:#111118;--ink2:#282835;--muted:#6a6a7a;--line:#e2e0da;
  --bg:#f5f4f0;--card:#ffffff;
  --accent:#e8380d;--accent-light:#fff1ee;
  --accent2:#f0a500;--green:#0d9e6a;
  --shadow:0 4px 28px rgba(0,0,0,.08);
  --shadow-lg:0 12px 48px rgba(0,0,0,.14);
}
html{scroll-behavior:smooth;}
body{font-family:var(--gothic);background:var(--bg);color:var(--ink);min-height:100vh;}

.header{position:sticky;top:0;z-index:300;background:var(--ink);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 2px 16px rgba(0,0,0,.3);}
.header-brand{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.05em;display:flex;align-items:center;gap:8px;text-decoration:none;}
.header-brand-accent{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.header-badge{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);font-size:.65rem;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.06em;}
.back-btn{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 11px;font-size:.68rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.back-btn:hover{background:rgba(255,255,255,.2);color:#fff;}

.hero{background:var(--ink);padding:44px 28px 40px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%, rgba(232,56,13,.2) 0%, transparent 60%),radial-gradient(ellipse at 80% 30%, rgba(240,165,0,.12) 0%, transparent 55%);}
.hero-content{position:relative;z-index:1;}
.hero-eyebrow{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;}
.hero-title{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-.01em;line-height:1.2;margin-bottom:6px;}
.hero-title span{color:var(--accent);}
.hero-sub{font-size:.84rem;color:rgba(255,255,255,.5);max-width:400px;margin:0 auto;}

.container{max-width:860px;margin:0 auto;padding:44px 18px 80px;}

/* Login */
.login-card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);max-width:420px;margin:0 auto;}
.login-inner{padding:40px 32px;text-align:center;}
.login-icon{font-size:2.4rem;margin-bottom:16px;}
.login-title{font-size:1.1rem;font-weight:900;margin-bottom:6px;}
.login-sub{font-size:.8rem;color:var(--muted);margin-bottom:24px;}
.pin-row{display:flex;gap:8px;justify-content:center;}
.pin-input{flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:var(--mono);text-align:center;letter-spacing:.18em;outline:none;transition:border-color .18s;}
.pin-input:focus{border-color:var(--accent);}
.pin-input.shake{animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.pin-btn{padding:12px 20px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .18s;white-space:nowrap;}
.pin-btn:hover{background:#c02d0a;}
.pin-err{font-size:.76rem;color:var(--accent);margin-top:10px;height:16px;text-align:center;}

/* Admin panel */
.admin-panel{display:none;}
.admin-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
.admin-bar-title{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;}
.admin-bar-badge{background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.admin-logout{background:transparent;border:2px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .18s;}
.admin-logout:hover{border-color:var(--accent);color:var(--accent);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.admin-card{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
.admin-card-title{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.admin-link-btn{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:14px 16px;width:100%;cursor:pointer;font-family:var(--gothic);font-size:.88rem;font-weight:700;transition:all .18s;text-decoration:none;}
.admin-link-btn:hover{background:var(--ink2);transform:translateY(-1px);}
.btn-right{display:flex;align-items:center;gap:8px;font-family:var(--mono);}
.new-pill{background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.field-row{display:flex;gap:8px;margin-bottom:8px;}
.field-input{flex:1;padding:10px 12px;border:2px solid var(--line);border-radius:9px;font-size:.84rem;font-family:var(--gothic);outline:none;transition:border-color .18s;}
.field-input:focus{border-color:var(--accent);}
.save-btn{padding:10px 14px;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .18s;white-space:nowrap;}
.save-btn:hover{background:#0a8459;}
.field-note{font-size:.72rem;color:var(--muted);}

/* Price editor */
.price-editor-wrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.price-editor-header{padding:20px 22px 16px;}
.price-editor-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--accent2);color:var(--ink);border:none;border-radius:10px;padding:14px 16px;width:100%;cursor:pointer;font-family:var(--gothic);font-size:.88rem;font-weight:700;transition:all .18s;}
.price-editor-toggle:hover{background:#d4920a;}
.price-editor-body{padding:0 22px 24px;}

/* ADM UI */
.adm-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.adm-title{font-size:1.05rem;font-weight:900;}
.adm-sub{font-size:.76rem;color:var(--muted);}
.adm-btn-save{background:var(--green);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .15s;}
.adm-btn-save:hover{background:#0a8459;}
.adm-btn-reset{background:var(--bg);color:var(--muted);border:2px solid var(--line);padding:8px 14px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--gothic);}
.adm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:2px solid var(--line);padding-bottom:10px;}
.adm-tab{background:transparent;border:2px solid var(--line);border-radius:8px;padding:6px 13px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:var(--gothic);transition:all .15s;}
.adm-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.adm-tab:hover:not(.active){border-color:var(--ink);}
.adm-section{margin-bottom:22px;}
.adm-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.adm-add-btn{background:var(--accent);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--gothic);}
.adm-card{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:13px;margin-bottom:7px;transition:border-color .15s;}
.adm-card:hover{border-color:var(--muted);}
.adm-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.adm-card-label{font-size:.84rem;font-weight:700;}
.adm-icon-btn{background:transparent;border:2px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.75rem;cursor:pointer;transition:all .15s;font-family:var(--gothic);}
.adm-icon-btn:hover{background:var(--line);}
.adm-icon-btn.danger:hover{background:#ffe5e5;border-color:#ffc0c0;}
.adm-price-preview{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:5px;}
.adm-saving{color:var(--green);margin-left:8px;font-weight:700;}
.adm-edit-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
.adm-row{display:flex;align-items:center;gap:10px;}
.adm-row label{font-size:.7rem;color:var(--muted);font-weight:700;min-width:160px;flex-shrink:0;}
.adm-input-sm{flex:1;padding:7px 10px;border:2px solid var(--line);border-radius:7px;font-size:.82rem;font-family:var(--gothic);background:#fff;outline:none;transition:border-color .15s;}
.adm-input-sm:focus{border-color:var(--accent);}
.adm-step-block{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.adm-step-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.adm-step-badge{background:var(--ink);color:#fff;font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.06em;}
.adm-opts-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;padding-top:10px;border-top:1px dashed var(--line);}
.sync-ok{font-size:.76rem;color:var(--green);margin-top:10px;padding:8px 12px;background:rgba(13,158,106,.08);border-radius:8px;border-left:3px solid var(--green);}
.sync-err{font-size:.76rem;color:var(--accent);margin-top:10px;padding:8px 12px;background:var(--accent-light);border-radius:8px;border-left:3px solid var(--accent);}

/* Recent */
.recent-sec{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
.recent-title{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.recent-list{display:flex;flex-direction:column;gap:8px;}
.recent-item{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:all .18s;border:2px solid transparent;}
.recent-item:hover{border-color:var(--line);}
.recent-item-left{min-width:0;}
.recent-name{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-meta{font-size:.72rem;color:var(--muted);display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;}
.recent-date{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.66rem;font-weight:700;}
.badge-new{background:var(--accent-light);color:var(--accent);}
.badge-web{background:#e8f4ff;color:#2563eb;}
.badge-video{background:#f3e8ff;color:#7c3aed;}
.badge-app{background:#e8fff4;color:#059669;}
.badge-system{background:#fff3e8;color:#d97706;}
.badge-design{background:#ffe8f4;color:#db2777;}
.no-submissions{text-align:center;padding:20px;color:var(--muted);font-size:.82rem;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:30px;font-size:.82rem;opacity:0;transition:all .28s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  .admin-grid{grid-template-columns:1fr;}
  .hero-title{font-size:1.4rem;}
  .adm-row{flex-direction:column;align-items:flex-start;}
  .adm-row label{min-width:unset;}
  .adm-input-sm{width:100%;}
}
@media(max-width:420px){.pin-row{flex-direction:column;}.login-inner{padding:28px 20px;}}
</style>
</head>
<body>

<header class="header">
  <a class="header-brand" href="portal.html"><span class="header-brand-accent">YOSHIZAKI</span> STUDIO</a>
  <div class="header-right">
    <span class="header-badge">ADMIN</span>
    <a class="back-btn" href="portal.html">← ポータルへ</a>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <div class="hero-eyebrow">Administrator Access</div>
    <h1 class="hero-title"><span>管理者</span>ページ</h1>
    <p class="hero-sub">PINコードを入力して管理機能にアクセスしてください</p>
  </div>
</section>

<div class="container">

  <div class="login-card" id="loginCard">
    <div class="login-inner">
      <div class="login-icon">🔐</div>
      <div class="login-title">管理者ログイン</div>
      <div class="login-sub">PINコードを入力してください</div>
      <div class="pin-row">
        <input class="pin-input" id="pinInput" type="password" maxlength="20" placeholder="PIN"
          onkeydown="if(event.key==='Enter')checkPin()"
          oninput="document.getElementById('pinErr').textContent=''">
        <button class="pin-btn" onclick="checkPin()">ログイン</button>
      </div>
      <div class="pin-err" id="pinErr"></div>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">

    <div class="admin-top-bar">
      <div class="admin-bar-title">
        🔓 管理者モード
        <span class="admin-bar-badge" id="adminNewBadge" style="display:none;"></span>
      </div>
      <button class="admin-logout" onclick="doLogout()">ログアウト</button>
    </div>

    <div class="admin-grid">
      <div class="admin-card">
        <div class="admin-card-title">ヒアリング一覧</div>
        <a class="admin-link-btn" href="hearing_list.html" target="_blank">
          <span>送信一覧・ステータス管理</span>
          <span class="btn-right"><span class="new-pill" id="listNewCount" style="display:none;"></span>→</span>
        </a>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">管理者メールアドレス</div>
        <div class="field-row">
          <input class="field-input" id="adminEmailInput" type="email" placeholder="your@email.com">
          <button class="save-btn" onclick="saveAdminEmail()">保存</button>
        </div>
        <div class="field-note" id="emailCurrent"></div>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">パスワード変更</div>
        <div class="field-row">
          <input class="field-input" id="newPinInput" type="password" placeholder="新しいPIN" maxlength="30">
          <button class="save-btn" onclick="changePin()">変更</button>
        </div>
        <div class="field-note" id="pinSyncNote"></div>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">クラウド同期キー</div>
        <div class="field-row">
          <input class="field-input" id="workerKeyInput" type="password" placeholder="worker admin key">
          <button class="save-btn" onclick="saveWorkerKey()">保存</button>
        </div>
        <div class="field-note" id="syncStatus">Workerへの保存に使うキー（デフォルト: admin1234）</div>
      </div>
    </div>

    <!-- インライン料金エディタ -->
    <div class="price-editor-wrap">
      <div class="price-editor-header">
        <div class="admin-card-title" style="margin-bottom:12px;">見積もり料金変更</div>
        <button class="price-editor-toggle" onclick="togglePriceEditor()" id="priceToggleBtn">
          <span>料金・プラン・ステップ編集</span>
          <span id="priceEditorArrow">▼ 開く</span>
        </button>
      </div>
      <div id="priceEditorSection" style="display:none;">
        <div class="price-editor-body">
          <div id="priceEditorStatus"></div>
          <div id="priceEditorInner"></div>
        </div>
      </div>
    </div>

    <div class="recent-sec">
      <div class="recent-title">最近の送信（最新5件）</div>
      <div class="recent-list" id="recentList"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──
const DEFAULT_PIN   = 'admin1234';
const SK_PIN        = 'ty_admin_pin';
const SK_SESSION    = 'ty_admin_ok';
const SESSION_MS    = 30 * 60 * 1000;
const SK_SUBS       = 'ty_submissions';
const SK_EMAIL      = 'ty_admin_email';
const SK_WKEY       = 'ty_worker_key';
const DEFAULT_EMAIL = 't.yoshizaki.taka@gmail.com';
const WORKERS_URL   = 'https://rapid-dream-c353.t-yoshizaki-taka.workers.dev';

function getPin()       { return localStorage.getItem(SK_PIN) || DEFAULT_PIN; }
function getWorkerKey() { return localStorage.getItem(SK_WKEY) || 'admin1234'; }
function getSubmissions(){ try{ return JSON.parse(localStorage.getItem(SK_SUBS)||'[]'); }catch(e){ return []; } }
function isSessionValid(){ return Date.now() - parseInt(localStorage.getItem(SK_SESSION)||'0') < SESSION_MS; }
function touchSession(){ localStorage.setItem(SK_SESSION, Date.now()); }
function clearSession(){ localStorage.removeItem(SK_SESSION); }

// ── Worker ──
async function workerGet(){
  const res = await fetch(`${WORKERS_URL}?action=getData&_t=${Date.now()}`, {cache:'no-store'});
  if(!res.ok) throw new Error('GET failed');
  const j = await res.json();
  return j.data || {};
}
async function workerSave(data){
  const res = await fetch(`${WORKERS_URL}?action=saveData`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminKey: getWorkerKey(), data })
  });
  if(!res.ok) throw new Error('SAVE failed');
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'rejected');
  return j;
}
async function syncFromWorker(){
  try {
    const data = await workerGet();
    if(data.__adminPin__)   localStorage.setItem(SK_PIN, data.__adminPin__);
    if(data.__adminEmail__) localStorage.setItem(SK_EMAIL, data.__adminEmail__);
    if(Array.isArray(data.__submissions__)) localStorage.setItem(SK_SUBS, JSON.stringify(data.__submissions__));
  } catch(e){}
}

// ── Price data ──
const CATS_DEFAULT = {
  web:{ label:'Webサイト制作', icon:'🌐', color:'#2563eb',
    sets:[
      {id:'ws1',tag:'スタートアップ向け',name:'LP スターターパック',popular:false,chips:['LP（1P）','レスポンシブ','お問い合わせ','SEO内部対策'],original:297000,price:247500,saving:49500,presets:{}},
      {id:'ws2',popular:true,tag:'中小企業向け',name:'コーポレート スタンダード',chips:['コーポレート（小）','CMS','SEO内部対策','GA4','レスポンシブ'],original:522000,price:435000,saving:87000,presets:{}},
      {id:'ws3',tag:'EC・ショップ向け',name:'ECサイト スタンダード',chips:['ECサイト','CMS','SEO','GA4','月額保守'],original:792000,price:660000,saving:132000,presets:{}},
    ],
    steps:[
      {id:'step-w1',label:'Step 1',title:'サイトタイプを選択',sub:'最も近いものを1つ選んでください。',type:'single',options:[
        {id:'lp',icon:'🎯',name:'ランディングページ（LP）',desc:'1ページで訴求・CV重視',price:135000},
        {id:'web-small',icon:'🏢',name:'コーポレートサイト（5P前後）',desc:'5〜8ページの企業サイト',price:180000},
        {id:'web-medium',icon:'🌐',name:'コーポレートサイト（中規模）',desc:'10〜25ページ、ブログ・採用含む',price:360000},
        {id:'ec-site',icon:'🛒',name:'ECサイト（Shopify等）',desc:'商品販売・カート・決済付き',price:540000},
        {id:'service-st',icon:'⚙️',name:'サービスサイト',desc:'会員・予約・業務フロー',price:270000},
        {id:'renewal',icon:'🔄',name:'リニューアル',desc:'既存サイトをリデザイン・再構築',price:180000},
      ]},
      {id:'step-w2',label:'Step 2',title:'ページ構成を選択',sub:'必要なページを複数選択。数量指定可。',type:'multi',options:[
        {id:'top',icon:'🏠',name:'トップページ',desc:'FV・メインビジュアル含む',price:50000},
        {id:'about',icon:'👤',name:'会社概要・About',desc:'企業情報・ミッション・沿革',price:20000},
        {id:'service-p',icon:'📋',name:'サービス紹介ページ',desc:'各サービスの説明ページ',price:25000,qty:true},
        {id:'blog',icon:'✍️',name:'ブログ・お知らせ',desc:'一覧＋詳細ページセット',price:35000},
        {id:'works',icon:'💼',name:'実績・事例紹介',desc:'ポートフォリオ・事例一覧',price:30000},

  {id:'normal',  label:'📅 通常納期',              rate:0,   sign:'', desc:'標準スケジュール'},
  {id:'relaxed', label:'🌿 ゆったり（+1ヶ月〜）',  rate:-0.05,sign:'-',desc:'5%割引'},
  {id:'flexible',label:'🍃 完全フレキシブル（+2ヶ月〜）',rate:-0.1,sign:'-',desc:'10%割引'},
];
let GLOBAL_SETTINGS = {saleEnabled:true,saleRate:50,salePeriod:'2026年8月末'};
let CATS = JSON.parse(JSON.stringify(CATS_DEFAULT));
let adminCurrentCat = '__settings__';
let priceEditorOpen = false;
let priceDataLoaded = false;

// ── Utils ──
const TYPE_LABEL   = {web:'Web制作',video:'動画編集',app:'アプリ開発',system:'システム開発',design:'デザイン'};
const STATUS_LABEL = {new:'新着',contacted:'連絡済み',inprogress:'対応中',done:'完了'};
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function toggleEl(id){ const e=document.getElementById(id); if(e) e.style.display=e.style.display==='none'?'block':'none'; }

// ── Auth ──
function checkPin(){
  const val = document.getElementById('pinInput').value;
  if(val === getPin()){ touchSession(); openPanel(); }
  else {
    const inp = document.getElementById('pinInput');
    document.getElementById('pinErr').textContent='PINが正しくありません';
    inp.classList.add('shake'); inp.value='';
    setTimeout(()=>inp.classList.remove('shake'),400);
  }
}
function openPanel(){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  renderPanel();
}
function doLogout(){
  clearSession();
  document.getElementById('loginCard').style.display='block';
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('pinInput').value='';
  priceEditorOpen=false; priceDataLoaded=false;
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
}

// ── Panel ──
function renderPanel(){
  const subs=getSubmissions();
  const newCount=subs.filter(s=>s.status==='new').length;
  const nb=document.getElementById('adminNewBadge');
  if(newCount>0){nb.textContent=`新着 ${newCount}件`;nb.style.display='inline-block';}else{nb.style.display='none';}
  const lnc=document.getElementById('listNewCount');
  if(newCount>0){lnc.textContent=`新着 ${newCount}`;lnc.style.display='inline-block';}else{lnc.style.display='none';}
  const currentEmail=localStorage.getItem(SK_EMAIL)||DEFAULT_EMAIL;
  document.getElementById('adminEmailInput').value=currentEmail;
  document.getElementById('emailCurrent').textContent=`現在の設定：${currentEmail}`;
  document.getElementById('workerKeyInput').value=localStorage.getItem(SK_WKEY)||'';
  const recent=subs.slice(0,5);
  const list=document.getElementById('recentList');
  if(!recent.length){list.innerHTML='<div class="no-submissions">まだ送信はありません</div>';return;}
  list.innerHTML=recent.map(s=>{
    const isNew=s.status==='new';
    return `<div class="recent-item" onclick="window.open('hearing_list.html','_blank')">
      <div class="recent-item-left">
        <div class="recent-name">${esc(s.clientName||'（名称未入力）')}</div>
        <div class="recent-meta">
          <span class="badge badge-${s.type||'web'}">${TYPE_LABEL[s.type]||s.type}</span>
          ${isNew?'<span class="badge badge-new">新着</span>':`<span>${STATUS_LABEL[s.status]||s.status}</span>`}
          ${s.email?`<span>${esc(s.email)}</span>`:''}
        </div>
      </div>
      <div class="recent-date">${fmtDate(s.timestamp)}</div>
    </div>`;
  }).join('');
}

function saveAdminEmail(){
  const val=document.getElementById('adminEmailInput').value.trim();
  if(!val){showToast('メールアドレスを入力してください');return;}
  localStorage.setItem(SK_EMAIL,val);
  document.getElementById('emailCurrent').textContent=`現在の設定：${val}`;
  (async()=>{
    try{ const data=await workerGet(); data.__adminEmail__=val; await workerSave(data); showToast('メールアドレスを保存しました（全端末に反映）'); }
    catch(e){ showToast('メールアドレスを保存しました（ローカルのみ）'); }
  })();
}

async function changePin(){
  const val=document.getElementById('newPinInput').value.trim();
  if(!val){showToast('新しいPINを入力してください');return;}
  if(val.length<4){showToast('4文字以上で設定してください');return;}
  localStorage.setItem(SK_PIN,val);
  const note=document.getElementById('pinSyncNote');
  try{
    const data=await workerGet(); data.__adminPin__=val; await workerSave(data);
    note.textContent='変更済み（全端末に反映されました）'; note.style.color='var(--green)';
    showToast('PINを変更しました（全端末に反映）');
  }catch(e){
    note.textContent='変更済み（クラウド同期失敗 — このデバイスのみ）'; note.style.color='var(--accent)';
    showToast('PIN変更済み（同期失敗）');
  }
  document.getElementById('newPinInput').value='';
}

function saveWorkerKey(){
  const val=document.getElementById('workerKeyInput').value.trim();
  localStorage.setItem(SK_WKEY,val||'admin1234');
  const el=document.getElementById('syncStatus');
  el.textContent='キーを保存しました。次回の保存から有効です。'; el.style.color='var(--green)';
  showToast('Workerキーを保存しました');
}

// ── Price editor ──
async function togglePriceEditor(){
  const section=document.getElementById('priceEditorSection');
  const arrow=document.getElementById('priceEditorArrow');
  priceEditorOpen=!priceEditorOpen;
  if(priceEditorOpen){
    arrow.textContent='▲ 閉じる';
    section.style.display='block';
    if(!priceDataLoaded){
      document.getElementById('priceEditorStatus').innerHTML='<div style="padding:12px 0;color:var(--muted);font-size:.82rem;">データを読み込み中...</div>';
      try{
        const data=await workerGet();
        mergePriceData(data);
        priceDataLoaded=true;
        document.getElementById('priceEditorStatus').innerHTML='<div class="sync-ok">✅ クラウドから最新データを読み込みました</div>';
      }catch(e){
        document.getElementById('priceEditorStatus').innerHTML='<div class="sync-err">⚠️ クラウドへの接続に失敗しました。デフォルト値を表示しています。<br>「クラウド同期キー」が正しいか確認してください。</div>';
        priceDataLoaded=true;
      }
      renderPriceEditor();
    }
    setTimeout(()=>section.scrollIntoView({behavior:'smooth',block:'start'}),80);
  }else{
    arrow.textContent='▼ 開く';
    section.style.display='none';
  }
}

function mergePriceData(data){
  if(!data) return;
  Object.keys(data).forEach(catId=>{
    if(catId==='__settings__'){
      if(data[catId].globalSettings)  Object.assign(GLOBAL_SETTINGS,data[catId].globalSettings);
      if(data[catId].deliveryOptions) DELIVERY_OPTIONS.splice(0,DELIVERY_OPTIONS.length,...data[catId].deliveryOptions);
      return;
    }
    if(!CATS[catId]) return;
    if(data[catId].sets)  CATS[catId].sets  = data[catId].sets;
    if(data[catId].steps) CATS[catId].steps = data[catId].steps;
  });
}

function renderPriceEditor(){
  const cats=Object.entries(CATS);
  document.getElementById('priceEditorInner').innerHTML=`
    <div class="adm-header" style="margin-top:16px;">
      <div><div class="adm-title">⚙️ 料金・プラン編集</div><div class="adm-sub">変更後は「保存して反映」を押してください。全端末に同期されます。</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="adm-btn-save" onclick="saveAllAdmin()">💾 保存して反映</button>
        <button class="adm-btn-reset" onclick="resetAdminData()">↺ 初期化</button>
      </div>
    </div>
    <div class="adm-tabs" id="priceAdminTabs">
      <button class="adm-tab${adminCurrentCat==='__settings__'?' active':''}" onclick="switchAdminTab('__settings__',this)">⚙️ 全体設定</button>
      ${cats.map(([id,c])=>`<button class="adm-tab${id===adminCurrentCat?' active':''}" onclick="switchAdminTab('${id}',this)">${c.icon} ${c.label}</button>`).join('')}
    </div>
    <div id="adminTabContent"></div>
    <div style="margin-top:16px;"><button class="adm-btn-save" onclick="saveAllAdmin()">💾 保存して反映</button></div>`;
  if(adminCurrentCat==='__settings__') renderAdminSettings();
  else renderAdminTab(adminCurrentCat);
}

function switchAdminTab(catId,btn){
  adminCurrentCat=catId;
  document.querySelectorAll('#priceAdminTabs .adm-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(catId==='__settings__') renderAdminSettings();
  else renderAdminTab(catId);
}

function renderAdminSettings(){
  document.getElementById('adminTabContent').innerHTML=`
    <div class="adm-section">
      <div class="adm-section-head"><span>🎉 キャンペーン設定</span></div>
      <div class="adm-card"><div class="adm-edit-body">
        <div class="adm-row"><label>キャンペーン有効</label>
          <select class="adm-input-sm" onchange="GLOBAL_SETTINGS.saleEnabled=this.value==='true'">
            <option value="true"  ${GLOBAL_SETTINGS.saleEnabled?'selected':''}>有効（割引を表示）</option>
            <option value="false" ${!GLOBAL_SETTINGS.saleEnabled?'selected':''}>無効（通常価格を表示）</option>
          </select></div>
        <div class="adm-row"><label>OFF率（%）</label>
          <input class="adm-input-sm" type="number" min="1" max="99" value="${GLOBAL_SETTINGS.saleRate}" oninput="GLOBAL_SETTINGS.saleRate=Number(this.value)"></div>
        <div class="adm-row"><label>キャンペーン期間</label>
          <input class="adm-input-sm" value="${esc(GLOBAL_SETTINGS.salePeriod)}" oninput="GLOBAL_SETTINGS.salePeriod=this.value"></div>
      </div>
      <div class="adm-price-preview" style="margin-top:10px;">現在: ${GLOBAL_SETTINGS.saleEnabled?`<strong>${GLOBAL_SETTINGS.saleRate}%OFF</strong>（〜${esc(GLOBAL_SETTINGS.salePeriod)}）`:'<span style="color:var(--muted)">キャンペーン無効</span>'}</div>
      </div>
    </div>
    <div class="adm-section">
      <div class="adm-section-head"><span>🗓️ 納品スケジュール 料率設定</span></div>
      ${DELIVERY_OPTIONS.map((d,di)=>`
      <div class="adm-card">
        <div class="adm-card-head"><span class="adm-card-label">${esc(d.label)}</span>
          <button class="adm-icon-btn" onclick="toggleEl('deliv-edit-${di}')">✏️ 編集</button></div>
        <div id="deliv-edit-${di}" style="display:none;" class="adm-edit-body">
          <div class="adm-row"><label>ラベル</label><input class="adm-input-sm" value="${esc(d.label)}" oninput="DELIVERY_OPTIONS[${di}].label=this.value"></div>
          <div class="adm-row"><label>料率（0.5=+50%, -0.1=−10%）</label><input class="adm-input-sm" type="number" step="0.01" min="-0.5" max="2" value="${d.rate}" oninput="DELIVERY_OPTIONS[${di}].rate=Number(this.value)"></div>
          <div class="adm-row"><label>説明文</label><input class="adm-input-sm" value="${esc(d.desc)}" oninput="DELIVERY_OPTIONS[${di}].desc=this.value"></div>
        </div>
        <div class="adm-price-preview">${d.rate===0?'標準':(d.rate>0?'+':'')+Math.round(d.rate*100)+'%'} — ${esc(d.desc)}</div>
      </div>`).join('')}
    </div>`;
}

function renderAdminTab(catId){
  const cat=CATS[catId];
  let html='';

  // セットプラン
  html+=`<div class="adm-section"><div class="adm-section-head"><span>🎁 セットプラン</span><button class="adm-add-btn" onclick="addSet('${catId}')">＋ 追加</button></div>`;
  cat.sets.forEach((s,si)=>{
    html+=`<div class="adm-card">
      <div class="adm-card-head"><span class="adm-card-label">${s.popular?'⭐ ':''}${esc(s.name)}</span>
        <div style="display:flex;gap:5px;"><button class="adm-icon-btn" onclick="toggleEl('set-edit-${catId}-${si}')">✏️ 編集</button><button class="adm-icon-btn danger" onclick="deleteSet('${catId}',${si})">🗑️</button></div></div>
      <div id="set-edit-${catId}-${si}" style="display:none;" class="adm-edit-body">
        <div class="adm-row"><label>タグ</label><input class="adm-input-sm" value="${esc(s.tag)}" oninput="CATS['${catId}'].sets[${si}].tag=this.value"></div>
        <div class="adm-row"><label>プラン名</label><input class="adm-input-sm" value="${esc(s.name)}" oninput="CATS['${catId}'].sets[${si}].name=this.value"></div>
        <div class="adm-row"><label>内容チップ（カンマ区切り）</label><input class="adm-input-sm" value="${esc(s.chips.join(','))}" oninput="CATS['${catId}'].sets[${si}].chips=this.value.split(',').map(v=>v.trim())"></div>
        <div class="adm-row"><label>通常価格（税込）</label><input class="adm-input-sm" type="number" value="${s.original}" oninput="CATS['${catId}'].sets[${si}].original=Number(this.value);CATS['${catId}'].sets[${si}].saving=Number(this.value)-CATS['${catId}'].sets[${si}].price"></div>
        <div class="adm-row"><label>割引後価格（税込）</label><input class="adm-input-sm" type="number" value="${s.price}" oninput="CATS['${catId}'].sets[${si}].price=Number(this.value);CATS['${catId}'].sets[${si}].saving=CATS['${catId}'].sets[${si}].original-Number(this.value)"></div>
        <div class="adm-row"><label>割引額</label><input class="adm-input-sm" type="number" value="${s.saving}" oninput="CATS['${catId}'].sets[${si}].saving=Number(this.value)"></div>
        <div class="adm-row"><label>人気バッジ</label>
          <select class="adm-input-sm" onchange="CATS['${catId}'].sets[${si}].popular=this.value==='true'">
            <option value="false" ${!s.popular?'selected':''}>なし</option><option value="true" ${s.popular?'selected':''}>人気No.1</option>
          </select></div>
      </div>
      <div class="adm-price-preview">通常 <s>¥${s.original.toLocaleString()}</s> → <strong>¥${s.price.toLocaleString()}</strong> <span class="adm-saving">−¥${s.saving.toLocaleString()}</span></div>
    </div>`;
  });
  html+=`</div>`;

  // ステップ
  html+=`<div class="adm-section"><div class="adm-section-head"><span>📋 ステップ構成（${cat.steps.length}ステップ）</span>
    <button class="adm-add-btn" style="background:#2563eb" onclick="addStep('${catId}')">＋ ステップ追加</button></div>`;
  cat.steps.forEach((step,si)=>{
    html+=`<div class="adm-step-block">
      <div class="adm-step-head">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="adm-step-badge">Step ${si+1}</span>
          <div><div style="font-weight:700;font-size:.88rem;">${esc(step.title)}</div>
          <div style="font-size:.72rem;color:var(--muted);">${step.type==='single'?'単一選択':'複数選択'} / ${step.options.length}項目</div></div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          ${si>0?`<button class="adm-icon-btn" onclick="moveStep('${catId}',${si},-1)">↑</button>`:''}
          ${si<cat.steps.length-1?`<button class="adm-icon-btn" onclick="moveStep('${catId}',${si},1)">↓</button>`:''}
          <button class="adm-icon-btn" onclick="toggleEl('step-edit-${catId}-${si}')">✏️ 編集</button>
          ${cat.steps.length>1?`<button class="adm-icon-btn danger" onclick="deleteStep('${catId}',${si})">🗑️ 削除</button>`:''}
        </div>
      </div>
      <div id="step-edit-${catId}-${si}" style="display:none;" class="adm-edit-body">
        <div class="adm-row"><label>ステップ名</label><input class="adm-input-sm" value="${esc(step.title)}" oninput="CATS['${catId}'].steps[${si}].title=this.value"></div>
        <div class="adm-row"><label>説明文</label><input class="adm-input-sm" value="${esc(step.sub)}" oninput="CATS['${catId}'].steps[${si}].sub=this.value"></div>
        <div class="adm-row"><label>選択タイプ</label>
          <select class="adm-input-sm" onchange="CATS['${catId}'].steps[${si}].type=this.value">
            <option value="single" ${step.type==='single'?'selected':''}>単一選択（1つだけ）</option>
            <option value="multi"  ${step.type==='multi'?'selected':''}>複数選択（複数可）</option>
          </select></div>
        <div class="adm-opts-head">
          <span style="font-size:.75rem;font-weight:700;color:var(--muted);">📌 選択項目</span>
          <button class="adm-add-btn" onclick="addOption('${catId}',${si})">＋ 項目追加</button>
        </div><div>`;
    step.options.forEach((opt,oi)=>{
      html+=`<div class="adm-card" style="margin:6px 0;">
        <div class="adm-card-head"><span class="adm-card-label">${esc(opt.icon)} ${esc(opt.name)}</span>
          <div style="display:flex;gap:4px;">
            ${oi>0?`<button class="adm-icon-btn" onclick="moveOption('${catId}',${si},${oi},-1)">↑</button>`:''}
            ${oi<step.options.length-1?`<button class="adm-icon-btn" onclick="moveOption('${catId}',${si},${oi},1)">↓</button>`:''}
            <button class="adm-icon-btn" onclick="toggleEl('opt-edit-${catId}-${si}-${oi}')">✏️</button>
            <button class="adm-icon-btn danger" onclick="deleteOption('${catId}',${si},${oi})">🗑️</button>
          </div></div>
        <div id="opt-edit-${catId}-${si}-${oi}" style="display:none;" class="adm-edit-body">
          <div class="adm-row"><label>絵文字アイコン</label><input class="adm-input-sm" value="${esc(opt.icon)}" oninput="CATS['${catId}'].steps[${si}].options[${oi}].icon=this.value"></div>
          <div class="adm-row"><label>項目名</label><input class="adm-input-sm" value="${esc(opt.name)}" oninput="CATS['${catId}'].steps[${si}].options[${oi}].name=this.value"></div>
          <div class="adm-row"><label>説明文</label><input class="adm-input-sm" value="${esc(opt.desc)}" oninput="CATS['${catId}'].steps[${si}].options[${oi}].desc=this.value"></div>
          <div class="adm-row"><label>金額（税抜）</label><input class="adm-input-sm" type="number" value="${opt.price}" oninput="CATS['${catId}'].steps[${si}].options[${oi}].price=Number(this.value)"></div>
          <div class="adm-row"><label>備考（月額など）</label><input class="adm-input-sm" value="${esc(opt.note||'')}" oninput="CATS['${catId}'].steps[${si}].options[${oi}].note=this.value||undefined"></div>
          <div class="adm-row"><label>数量指定</label>
            <select class="adm-input-sm" onchange="if(this.value==='true'){CATS['${catId}'].steps[${si}].options[${oi}].qty=true}else{delete CATS['${catId}'].steps[${si}].options[${oi}].qty}">
              <option value="false" ${!opt.qty?'selected':''}>なし</option><option value="true" ${opt.qty?'selected':''}>あり（×個）</option>
            </select></div>
        </div>
        <div class="adm-price-preview">¥${opt.price.toLocaleString()}${opt.note?' / '+opt.note:''}</div>
      </div>`;
    });
    html+=`</div></div></div>`;
  });
  html+=`</div>`;

  // 納品スケジュール参照
  html+=`<div class="adm-section"><div class="adm-section-head"><span>🗓️ 納品スケジュール</span><span style="font-size:.72rem;color:var(--muted);">「全体設定」タブで編集</span></div>
    <div class="adm-card"><table style="width:100%;font-size:.78rem;border-collapse:collapse;">
      <tr style="background:var(--bg)"><th style="padding:6px 10px;text-align:left;">スケジュール</th><th style="padding:6px 10px;text-align:right;">料率</th></tr>
      ${DELIVERY_OPTIONS.map(d=>`<tr><td style="padding:7px 10px;border-bottom:1px solid var(--line);">${esc(d.label)}</td><td style="padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);color:${d.rate>0?'var(--accent)':d.rate<0?'var(--green)':'var(--muted)'}">${d.rate===0?'標準':(d.rate>0?'+':'')+Math.round(d.rate*100)+'%'}</td></tr>`).join('')}
    </table></div></div>`;

  document.getElementById('adminTabContent').innerHTML=html;
}

// ── Step/Option/Set operations ──
function addStep(catId){ const si=CATS[catId].steps.length; CATS[catId].steps.push({id:`step-new-${catId}-${Date.now()}`,label:`Step ${si+1}`,title:'新しいステップ',sub:'項目を選択してください。',type:'multi',options:[{id:`opt-new-${Date.now()}`,icon:'✨',name:'新しい項目',desc:'説明文を入力',price:50000}]}); renderAdminTab(catId); showToast(`Step ${si+1} を追加しました`); }
function deleteStep(catId,si){ if(!confirm(`Step ${si+1}「${CATS[catId].steps[si].title}」を削除しますか？`))return; CATS[catId].steps.splice(si,1); CATS[catId].steps.forEach((s,i)=>{s.label=`Step ${i+1}`;}); renderAdminTab(catId); showToast('ステップを削除しました'); }
function moveStep(catId,si,dir){ const steps=CATS[catId].steps,t=si+dir; if(t<0||t>=steps.length)return; [steps[si],steps[t]]=[steps[t],steps[si]]; steps.forEach((s,i)=>{s.label=`Step ${i+1}`;}); renderAdminTab(catId); }
function addOption(catId,si){ CATS[catId].steps[si].options.push({id:`opt-new-${Date.now()}`,icon:'✨',name:'新しい項目',desc:'説明文を入力',price:50000}); renderAdminTab(catId); showToast('項目を追加しました'); }
function deleteOption(catId,si,oi){ if(!confirm('この項目を削除しますか？'))return; CATS[catId].steps[si].options.splice(oi,1); renderAdminTab(catId); }
function moveOption(catId,si,oi,dir){ const opts=CATS[catId].steps[si].options,t=oi+dir; if(t<0||t>=opts.length)return; [opts[oi],opts[t]]=[opts[t],opts[oi]]; renderAdminTab(catId); }
function addSet(catId){ CATS[catId].sets.push({id:`set-new-${Date.now()}`,tag:'新しいタグ',name:'新しいセットプラン',popular:false,chips:['項目1','項目2'],original:500000,price:400000,saving:100000,presets:{}}); renderAdminTab(catId); showToast('セットプランを追加しました'); }
function deleteSet(catId,si){ if(!confirm('このセットプランを削除しますか？'))return; CATS[catId].sets.splice(si,1); renderAdminTab(catId); }

// ── Save / Reset ──
async function saveAllAdmin(){
  const statusEl=document.getElementById('priceEditorStatus');
  statusEl.innerHTML='<div style="padding:8px 0;color:var(--muted);font-size:.82rem;">保存中...</div>';
  try{
    let data={};
    try{ data=await workerGet(); }catch(e){}
    Object.keys(CATS).forEach(catId=>{ data[catId]={sets:CATS[catId].sets,steps:CATS[catId].steps}; });
    data.__settings__={globalSettings:GLOBAL_SETTINGS,deliveryOptions:DELIVERY_OPTIONS};
    await workerSave(data);
    // 同端末でも即時反映されるようlocalStorageにも保存
    localStorage.setItem('ty_price_data', JSON.stringify(data));
    statusEl.innerHTML='<div class="sync-ok">✅ 保存しました。全端末に反映されます。</div>';
    showToast('✅ 保存しました！全端末に反映されます');
  }catch(e){
    statusEl.innerHTML=`<div class="sync-err">❌ 保存に失敗しました（${esc(e.message)}）<br>「クラウド同期キー」が正しいか確認してください。</div>`;
    showToast('❌ 保存に失敗しました');
  }
}

async function resetAdminData(){
  if(!confirm('すべての料金設定を初期値にリセットしますか？'))return;
  try{ await fetch(`${WORKERS_URL}?action=resetData`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey:getWorkerKey()})}); }catch(e){}
  CATS=JSON.parse(JSON.stringify(CATS_DEFAULT));
  DELIVERY_OPTIONS=[{id:'urgent',label:'⚡ 特急（通常の半分以下）',rate:0.5,sign:'+',desc:'通常納期の50%UP'},{id:'fast',label:'🔥 急ぎ（通常より早め）',rate:0.25,sign:'+',desc:'通常納期の25%UP'},{id:'normal',label:'📅 通常納期',rate:0,sign:'',desc:'標準スケジュール'},{id:'relaxed',label:'🌿 ゆったり（+1ヶ月〜）',rate:-0.05,sign:'-',desc:'5%割引'},{id:'flexible',label:'🍃 完全フレキシブル（+2ヶ月〜）',rate:-0.1,sign:'-',desc:'10%割引'}];
  GLOBAL_SETTINGS={saleEnabled:true,saleRate:50,salePeriod:'2026年8月末'};
  adminCurrentCat='__settings__';
  renderPriceEditor();
  showToast('初期値にリセットしました');
}

// ── Init ──
(async function(){
  await syncFromWorker();
  if(isSessionValid()){ touchSession(); openPanel(); }
  else { setTimeout(()=>document.getElementById('pinInput').focus(),200); }
})();
</script>
